<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e5eff">
<title>สรุปการสั่งชุดกีฬา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f8ff; --card:#ffffff; --text:#172b52; --muted:#6b7b99; --line:#dce5f3;
  --accent:#ff299b; --blue:#16bafa; --navy:#102b61; --gradient:linear-gradient(120deg,#ff299b,#19bfff);
  --ok:#1b7f3b; --ok-bg:#e6f8ee; --warn:#8a4b00; --warn-bg:#fff4e5; --bad:#c62828; --bad-bg:#fdeaea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --card:#17202f; --text:#e8edf6; --muted:#9aa6bb; --line:#2b3648;
    --accent:#ff5fb0; --navy:#e8edf6; --ok:#5fd28a; --ok-bg:#1d3a2a; --warn:#ffd39a; --warn-bg:#3a2a12; --bad:#ff6b6b; --bad-bg:#3a1d1d;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1420; --card:#17202f; --text:#e8edf6; --muted:#9aa6bb; --line:#2b3648;
  --accent:#ff5fb0; --navy:#e8edf6; --ok:#5fd28a; --ok-bg:#1d3a2a; --warn:#ffd39a; --warn-bg:#3a2a12; --bad:#ff6b6b; --bad-bg:#3a1d1d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Kanit,system-ui,sans-serif;font-size:16px;line-height:1.5}
.topbar{background:var(--card);box-shadow:0 3px 18px #193c7010;padding:14px 16px}
.logo{font-size:24px;font-weight:800;font-style:italic;color:var(--navy);line-height:1;max-width:760px;margin:0 auto}
.logo span{color:var(--accent);margin-left:4px}
.logo small{display:block;font-size:10px;font-style:normal;font-weight:500;letter-spacing:2px;color:var(--blue);margin-top:4px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:12px 0 4px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 5px 20px #193c7010}
.card h2{font-size:1.05rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){ .grid{grid-template-columns:repeat(4,1fr)} }
.stat{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.stat .k{font-size:.85rem;color:var(--muted)}
.stat .v{font-size:1.4rem;font-weight:800;color:var(--navy);line-height:1.2}
.stat .v small{font-size:.85rem;font-weight:600;color:var(--muted)}
.stat.ok .v{color:var(--ok)}
.stat.bad .v{color:var(--bad)}
.stat.warn .v{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.85rem}
.c{text-align:center}
tfoot td{font-weight:700}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.8rem;font-weight:700;white-space:nowrap}
.badge.full{background:var(--ok-bg);color:var(--ok)}
.badge.wait,.badge.partial{background:var(--warn-bg);color:var(--warn)}
.badge.none{background:var(--bad-bg);color:var(--bad)}
.badge.incomplete{background:var(--line);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:18px}
.note{color:var(--muted);font-size:.85rem;margin:10px 0 0}
select{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);width:100%;max-width:420px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.unpaid{margin:8px 0 0;padding-left:18px}
.unpaid li{margin:2px 0}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">ชุดกีฬา<span>สรุป</span><small>อัปเดตอัตโนมัติจากหน้าสั่งชุด</small></div>
</header>
<main class="wrap">
  <h1 id="title">สรุปการสั่งชุดกีฬา</h1>
  <p class="sub"><span class="live"></span><span id="liveText">กำลังโหลด...</span></p>

  <div class="card" id="pickerCard" hidden>
    <label for="orderSel" style="display:block;color:var(--muted);font-size:.9rem;font-weight:600;margin-bottom:4px">เลือกออเดอร์</label>
    <select id="orderSel"></select>
  </div>

  <section class="card" id="infoCard"></section>

  <section class="card">
    <h2>ยอดเงิน</h2>
    <div class="grid" id="stats"></div>
    <ul class="unpaid" id="unpaidList"></ul>
  </section>

  <section class="card">
    <h2>จำนวนที่ต้องสั่งตามไซส์</h2>
    <div class="scroll"><div id="sizes"></div></div>
  </section>

  <section class="card">
    <h2>รายชื่อสมาชิกและสถานะการจ่าย</h2>
    <div class="scroll"><div id="members"></div></div>
  </section>
</main>

<script>
const KEY = "uniform-order-v2";
const OLD_KEY = "uniform-order-v1";
const ALL_SIZES = ["SSS","SS","S","M","L","XL","2XL","3XL","4XL","5XL"];
const STATUS_LABEL = { full:"จ่ายครบแล้ว", wait:"ยอดครบ รอสลิป", partial:"จ่ายไม่ครบ", none:"ยังไม่จ่าย", incomplete:"กรอกไม่ครบ" };
const $ = id => document.getElementById(id);

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function baht(n){ return Number(n).toLocaleString("th-TH") + " บาท"; }
function thaiDate(v){
  if (!v) return "-";
  const [y,m,d] = v.split("-").map(Number);
  if (!y || !m || !d) return v;
  return new Date(y, m-1, d).toLocaleDateString("th-TH", {year:"numeric", month:"long", day:"numeric"});
}

// อ่านข้อมูลจากที่เดียวกับหน้าสั่งชุด ถ้าไม่มีข้อมูลก็ใช้ข้อมูลของเวอร์ชันเดิม
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.orders) && s.orders.length) return s;
  }catch(e){}
  try{
    const v1 = JSON.parse(localStorage.getItem(OLD_KEY));
    if (v1 && v1.info && Array.isArray(v1.students)){
      return { activeId:"o1", orders:[{ id:"o1", name:"", info:v1.info, students:v1.students, qr:"" }] };
    }
  }catch(e){}
  return null;
}

function isFilled(s){ return (s.name || "").trim() !== "" || s.shirt || s.pants; }
function isComplete(s){ return (s.name || "").trim() !== "" && s.shirt && s.pants; }
function paidOf(s, price){
  if (s.cash) return price;
  if (s.amount !== undefined && s.amount !== ""){
    return Math.min(Math.max(Number(s.amount) || 0, 0), price);
  }
  return s.paid ? price : 0;
}
function payStatus(s, price){
  if (!isComplete(s)) return "incomplete";
  const p = paidOf(s, price);
  if (price > 0 && p >= price) return (s.slip || s.cash) ? "full" : "wait";
  if (p > 0) return "partial";
  return "none";
}

function summarize(o){
  const price = Number(o.info.price) || 0;
  const list = o.students.filter(isFilled);
  const comp = list.filter(isComplete);
  let paidAmt = 0;
  const count = { full:0, wait:0, partial:0, none:0 };
  const notFull = [];
  for (const s of comp){
    paidAmt += paidOf(s, price);
    const st = payStatus(s, price);
    count[st]++;
    if (st !== "full") notFull.push({ name: s.name.trim(), status: st, remaining: price - paidOf(s, price) });
  }
  const sizes = ALL_SIZES.map(sz => ({
    sz,
    shirt: list.filter(s => s.shirt === sz).length,
    pants: list.filter(s => s.pants === sz).length
  }));
  return {
    price, list, comp, count, notFull, sizes,
    sets: comp.length,
    total: comp.length * price,
    paidAmt,
    dueAmt: comp.length * price - paidAmt,
    incomplete: list.length - comp.length,
    shirtTotal: list.filter(s => s.shirt).length,
    pantsTotal: list.filter(s => s.pants).length
  };
}

function render(){
  const state = loadState();
  if (!state){
    $("liveText").textContent = "ยังไม่มีข้อมูลในเบราว์เซอร์นี้ ให้เปิดหน้าสั่งชุดแล้วกรอกข้อมูลก่อน";
    $("infoCard").innerHTML = `<p class="empty">ไม่มีข้อมูลออเดอร์</p>`;
    $("stats").innerHTML = ""; $("sizes").innerHTML = ""; $("members").innerHTML = ""; $("unpaidList").innerHTML = "";
    return;
  }

  // เลือกออเดอร์: ใช้ออเดอร์ที่เปิดอยู่ในหน้าสั่งชุด และให้เลือกดูออเดอร์อื่นได้
  const sel = $("orderSel");
  const prev = sel.value;
  const activeId = prev && state.orders.some(o => o.id === prev) ? prev : state.activeId;
  sel.innerHTML = state.orders.map((o, i) =>
    `<option value="${o.id}"${o.id===activeId?" selected":""}>${esc(o.name) || "ออเดอร์ที่ " + (i+1)}</option>`).join("");
  $("pickerCard").hidden = state.orders.length < 2;

  const o = state.orders.find(x => x.id === sel.value) || state.orders[0];
  const S = summarize(o);
  const info = o.info;

  $("title").textContent = o.name ? `สรุป: ${o.name}` : "สรุปการสั่งชุดกีฬา";
  $("infoCard").innerHTML = `
    <h2>ข้อมูลการสั่ง</h2>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div><span class="sub">ทีม / โรงเรียน:</span> ${esc(info.school) || "-"}</div>
      <div><span class="sub">ผู้สั่ง:</span> ${esc(info.teacher) || "-"}</div>
      <div><span class="sub">ชั้น / รุ่น:</span> ${esc(info.klass) || "-"}</div>
      <div><span class="sub">ถึงร้าน:</span> ${esc(info.shop) || "-"}</div>
      <div><span class="sub">วันที่สั่ง:</span> ${thaiDate(info.date)}</div>
      <div><span class="sub">ราคาต่อชุด:</span> ${S.price ? baht(S.price) : "-"}</div>
    </div>`;

  const payStat = S.price
    ? `<div class="stat"><div class="k">ยอดรวมทั้งหมด</div><div class="v">${baht(S.total)}</div></div>
       <div class="stat ok"><div class="k">รับแล้ว</div><div class="v">${baht(S.paidAmt)}</div></div>
       <div class="stat bad"><div class="k">ค้างจ่าย</div><div class="v">${baht(S.dueAmt)}</div></div>`
    : `<div class="stat warn"><div class="k">ยังไม่ได้ใส่ราคาต่อชุด</div><div class="v">-</div></div>`;
  $("stats").innerHTML = `
    <div class="stat"><div class="k">สมาชิก</div><div class="v">${S.list.length} <small>คน</small></div></div>
    <div class="stat"><div class="k">จำนวนชุด (ครบ)</div><div class="v">${S.sets} <small>ชุด</small></div></div>
    <div class="stat ok"><div class="k">จ่ายครบแล้ว</div><div class="v">${S.count.full} <small>ชุด</small></div></div>
    <div class="stat warn"><div class="k">ยังไม่ครบ</div><div class="v">${S.sets - S.count.full} <small>ชุด</small></div></div>
    ${payStat}`;

  $("unpaidList").innerHTML = S.notFull.length
    ? `<li><b>ยังไม่จ่ายครบ:</b> ${S.notFull.map(x => {
        const label = x.status === "wait" ? "รอสลิป" : x.status === "partial" ? `ค้าง ${baht(x.remaining)}` : "ยังไม่จ่าย";
        return `${esc(x.name)} (${label})`;
      }).join(", ")}</li>`
    : `<li>จ่ายครบทุกคนแล้ว</li>`;
  if (S.incomplete > 0) $("unpaidList").innerHTML += `<li>มี ${S.incomplete} คนที่กรอกข้อมูลไม่ครบ จึงยังไม่นับเป็นชุด</li>`;

  $("sizes").innerHTML = `
    <table>
      <thead><tr><th>ไซส์</th><th class="c">เสื้อ (ตัว)</th><th class="c">กางเกง (ตัว)</th></tr></thead>
      <tbody>${S.sizes.map(r => `<tr><td>${r.sz}</td><td class="c">${r.shirt}</td><td class="c">${r.pants}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td>รวม</td><td class="c">${S.shirtTotal}</td><td class="c">${S.pantsTotal}</td></tr></tfoot>
    </table>`;

  $("members").innerHTML = S.list.length
    ? `<table>
        <thead><tr><th>ชื่อ-สกุล</th><th>ชื่อหลังเสื้อ</th><th class="c">เบอร์</th><th class="c">เสื้อ</th><th class="c">กางเกง</th><th>การจ่าย</th></tr></thead>
        <tbody>${S.list.map(s => {
          const st = payStatus(s, S.price);
          return `<tr>
            <td>${esc(s.name) || "-"}</td>
            <td>${esc(s.back) || "-"}</td>
            <td class="c">${esc(s.num) || "-"}</td>
            <td class="c">${s.shirt || "-"}</td>
            <td class="c">${s.pants || "-"}</td>
            <td><span class="badge ${st}">${STATUS_LABEL[st]}</span></td>
          </tr>`;
        }).join("")}</tbody>
      </table>`
    : `<p class="empty">ยังไม่มีรายชื่อ</p>`;

  $("liveText").textContent = `อัปเดตล่าสุด ${new Date().toLocaleTimeString("th-TH", {hour:"2-digit", minute:"2-digit", second:"2-digit"})}`;
}

// อัปเดตอัตโนมัติ: เมื่อข้อมูลในเบราว์เซอร์เปลี่ยน และตรวจทุก 3 วินาที (กรณีเปิดสองแท็บ)
window.addEventListener("storage", e => { if (e.key === KEY || e.key === OLD_KEY) render(); });
setInterval(render, 3000);
$("orderSel").addEventListener("change", render);

render();
</script>
</body>
</html>
